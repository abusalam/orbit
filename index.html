<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0b16">
  <title>Orbit — Swipe to spin</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0a0b16;
      color: #f7f5ff;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background:
        radial-gradient(ellipse at 50% 46%, rgba(84, 55, 169, .24), transparent 38%),
        radial-gradient(ellipse at 50% 110%, rgba(25, 115, 129, .12), transparent 42%),
        #0a0b16;
    }

    button { font: inherit; }

    .app {
      position: relative;
      display: grid;
      grid-template-rows: auto 1fr auto;
      width: 100%;
      height: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      padding: max(25px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
      overflow: hidden;
      isolation: isolate;
    }

    .app::before, .app::after {
      position: absolute;
      z-index: -1;
      width: 1px;
      height: 1px;
      content: "";
      border-radius: 50%;
      box-shadow: 0 0 180px 100px rgba(121, 76, 255, .09);
      pointer-events: none;
    }

    .app::before { top: 21%; left: 10%; }
    .app::after {
      right: 12%;
      bottom: 12%;
      box-shadow: 0 0 150px 90px rgba(48, 202, 195, .07);
    }

    .topbar, .bottombar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: min(100%, 980px);
      margin-inline: auto;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      color: #f4f0ff;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .brand-mark {
      display: grid;
      width: 30px;
      height: 30px;
      place-items: center;
      border: 1px solid rgba(181, 160, 255, .35);
      border-radius: 10px;
      color: #c3adff;
      background: rgba(139, 103, 255, .13);
      box-shadow: 0 0 22px rgba(132, 95, 255, .19);
    }

    .fullscreen {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      min-height: 42px;
      padding: 0 14px;
      border: 1px solid rgba(255, 255, 255, .11);
      border-radius: 13px;
      color: rgba(241, 238, 255, .82);
      background: rgba(255, 255, 255, .045);
      cursor: pointer;
      transition: background .2s ease, border-color .2s ease, transform .2s ease;
    }

    .fullscreen:hover {
      border-color: rgba(190, 169, 255, .4);
      background: rgba(255, 255, 255, .09);
    }

    .fullscreen:active { transform: scale(.97); }
    .fullscreen svg { width: 16px; height: 16px; }

    .stage {
      display: grid;
      min-height: 0;
      place-items: center;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .wheel-wrap {
      position: relative;
      width: min(88vw, 72vh, 760px);
      width: min(88vw, 72dvh, 760px);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
    }

    .wheel-wrap::before {
      position: absolute;
      inset: -9%;
      content: "";
      border: 1px solid rgba(193, 174, 255, .09);
      border-radius: 50%;
      box-shadow: 0 0 60px rgba(134, 97, 255, .08), inset 0 0 50px rgba(134, 97, 255, .035);
    }

    .wheel-wrap::after {
      position: absolute;
      inset: -15%;
      content: "";
      border: 1px solid rgba(193, 174, 255, .045);
      border-radius: 50%;
      pointer-events: none;
    }

    .wheel {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      border: 7px solid #171526;
      border-radius: 50%;
      background: var(--wheel-background, #e74c3c);
      box-shadow:
        0 24px 80px rgba(0, 0, 0, .48),
        0 0 75px rgba(121, 85, 235, .15),
        inset 0 0 0 1px rgba(255, 255, 255, .14);
      will-change: transform;
      cursor: grab;
    }

    .wheel:active { cursor: grabbing; }

    .wheel::before {
      position: absolute;
      inset: 0;
      content: "";
      border-radius: inherit;
      background: repeating-conic-gradient(
        from var(--wheel-start-angle),
        transparent 0deg calc(var(--segment-angle) - .45deg),
        rgba(13, 12, 30, .68) calc(var(--segment-angle) - .45deg) var(--segment-angle)
      );
    }

    .wheel::after {
      position: absolute;
      inset: 0;
      content: "";
      border-radius: inherit;
      background: radial-gradient(circle at 34% 24%, rgba(255, 255, 255, .14), transparent 32%);
      pointer-events: none;
    }

    .wheel-label {
      position: absolute;
      top: 50%;
      left: 50%;
      z-index: 1;
      color: rgba(255, 255, 255, .96);
      font-size: clamp(7px, 2vw, 15px);
      font-weight: 800;
      letter-spacing: .13em;
      text-shadow: 0 2px 9px rgba(17, 10, 47, .45);
      transform: translate(-50%, -50%) rotate(var(--label-angle));
      pointer-events: none;
    }

    .hub {
      position: absolute;
      z-index: 2;
      display: grid;
      width: 14%;
      aspect-ratio: 1;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, .26);
      border-radius: 50%;
      background: var(--pointer-color);
      box-shadow: 0 5px 22px rgba(8, 7, 18, .55), inset 0 1px 5px rgba(255, 255, 255, .14);
      pointer-events: none;
    }

    .hub-core {
      width: 26%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: linear-gradient(145deg, #c4aaff, #7955e7);
      box-shadow: 0 0 24px rgba(155, 117, 255, .8);
    }

    .pointer {
      position: absolute;
      top: -4.5%;
      z-index: 3;
      width: 30px;
      height: 42px;
      filter: drop-shadow(0 5px 8px rgba(0, 0, 0, .5));
      pointer-events: none;
    }

    .pointer svg { display: block; width: 100%; height: 100%; }

    .settings-view {
      display: flex;
      min-height: 0;
      justify-content: center;
      overflow-y: auto;
    }

    .settings-card {
      display: grid;
      gap: 20px;
      width: min(100%, 420px);
      margin-block: auto;
      padding: clamp(24px, 6vw, 40px);
      border: 1px solid rgba(255, 255, 255, .1);
      border-radius: 24px;
      background: rgba(18, 16, 34, .82);
      box-shadow: 0 24px 80px rgba(0, 0, 0, .35);
    }

    .settings-card h1 {
      margin: 0;
      color: #f4f0ff;
      font-size: clamp(24px, 5vw, 32px);
      letter-spacing: -.04em;
    }

    .settings-description {
      margin: -12px 0 0;
      color: rgba(203, 198, 222, .7);
      font-size: 14px;
      line-height: 1.5;
    }

    .settings-label {
      display: grid;
      gap: 9px;
      color: #e7e3f7;
      font-size: 13px;
      font-weight: 600;
    }

    .settings-select {
      min-height: 46px;
      padding: 0 13px;
      border: 1px solid rgba(255, 255, 255, .15);
      border-radius: 12px;
      color: #f7f5ff;
      background: #171526;
      font: inherit;
    }

    .settings-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .settings-save, .settings-back {
      display: inline-flex;
      min-height: 42px;
      align-items: center;
      justify-content: center;
      padding: 0 15px;
      border: 1px solid rgba(190, 169, 255, .28);
      border-radius: 12px;
      color: #f4f0ff;
      background: rgba(139, 103, 255, .16);
      font: inherit;
      text-decoration: none;
      cursor: pointer;
    }

    .settings-message {
      min-height: 1.4em;
      margin: -8px 0 0;
      color: #bca7ff;
      font-size: 13px;
    }

    [hidden] { display: none !important; }

    .app.settings-mode { grid-template-rows: auto 1fr; }
    .settings-mode .stage, .settings-mode .bottombar, .settings-mode .fullscreen { display: none; }
    .settings-mode #settingsView { display: grid; }

    .bottombar {
      align-items: flex-end;
    }

    .instruction {
      display: grid;
      gap: 7px;
    }

    .instruction-title {
      color: #f2efff;
      font-size: clamp(16px, 2.4vw, 21px);
      font-weight: 650;
      letter-spacing: -.025em;
    }

    .instruction-subtitle {
      color: rgba(203, 198, 222, .58);
      font-size: 13px;
      letter-spacing: .015em;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 34px;
      padding: 0 11px;
      border: 1px solid rgba(255, 255, 255, .08);
      border-radius: 99px;
      color: rgba(231, 227, 247, .65);
      background: rgba(255, 255, 255, .035);
      font-size: 11px;
      letter-spacing: .11em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #a78bfa;
      box-shadow: 0 0 10px rgba(167, 139, 250, .85);
    }

    .app.is-spinning .status-dot {
      background: #53dfca;
      box-shadow: 0 0 10px rgba(83, 223, 202, .85);
    }

    button:focus-visible {
      outline: 2px solid #bca7ff;
      outline-offset: 3px;
    }

    @media (max-width: 520px) {
      .app { padding-inline: 20px; }
      .wheel-wrap {
        width: min(94vw, 68vh, 700px);
        width: min(94vw, 68dvh, 700px);
      }
      .bottombar { align-items: center; }
      .instruction-subtitle { max-width: 240px; line-height: 1.5; }
      .status { padding-inline: 9px; font-size: 9px; }
      .fullscreen-label { display: none; }
      .fullscreen { width: 42px; padding: 0; }
    }

    @media (max-height: 520px) and (orientation: landscape) {
      .app { padding-top: max(14px, env(safe-area-inset-top)); padding-bottom: max(14px, env(safe-area-inset-bottom)); }
      .wheel-wrap { width: min(76vh, 70vw, 620px); width: min(76dvh, 70vw, 620px); }
      .instruction-title { font-size: 16px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; }
      .fullscreen { transition: none; }
    }
  </style>
</head>
<body>
  <main class="app" id="app">
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true">✦</span> Orbit</div>
      <button class="fullscreen" id="fullscreenButton" type="button" aria-label="Enter fullscreen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M3 16v3a2 2 0 0 0 2 2h3"/>
        </svg>
        <span class="fullscreen-label">Go fullscreen</span>
      </button>
    </header>

    <section class="settings-view" id="settingsView" hidden aria-labelledby="settingsTitle">
      <form class="settings-card" id="settingsForm">
        <h1 id="settingsTitle">Wheel settings</h1>
        <p class="settings-description">Choose how many colors appear on the wheel. Your choice is saved in this browser.</p>
        <label class="settings-label" for="colorCount">
          Number of colors
          <select class="settings-select" id="colorCount" name="colorCount">
            <option value="2">2 colors</option>
            <option value="3">3 colors</option>
            <option value="4">4 colors</option>
            <option value="5">5 colors</option>
            <option value="6">6 colors</option>
            <option value="7">7 colors</option>
            <option value="8" selected>8 colors</option>
            <option value="9">9 colors</option>
            <option value="10">10 colors</option>
            <option value="11">11 colors</option>
            <option value="12">12 colors</option>
            <option value="13">13 colors</option>
            <option value="14">14 colors</option>
            <option value="15">15 colors</option>
            <option value="16">16 colors</option>
          </select>
        </label>
        <div class="settings-actions">
          <a class="settings-back" id="backToWheel" href="./">Back to wheel</a>
          <button class="settings-save" type="submit">Save settings</button>
        </div>
        <p class="settings-message" id="settingsMessage" role="status" aria-live="polite"></p>
      </form>
    </section>

    <section class="stage" id="stage" aria-label="Swipe up or down on the wheel to spin it">
      <div class="wheel-wrap">
        <div class="wheel" id="wheel" role="img" aria-label="Eight-section color wheel"></div>
        <div class="hub" aria-hidden="true"><div class="hub-core"></div></div>
        <div class="pointer" aria-hidden="true">
          <svg viewBox="0 0 30 42" fill="none">
            <path d="M15 40 2.5 4.5C1.7 2.2 4.1.2 6.2 1.5L15 7l8.8-5.5c2.1-1.3 4.5.7 3.7 3L15 40Z" fill="var(--pointer-color)"/>
            <path d="M15 38 4.4 7.8 15 13.6 25.6 7.8 15 38Z" fill="#fff" fill-opacity=".3"/>
          </svg>
        </div>
      </div>
    </section>

    <footer class="bottombar">
      <div class="instruction">
        <div class="instruction-title" id="instructionTitle">Swipe to set it in motion</div>
        <div class="instruction-subtitle" id="instructionSubtitle">Swipe up or down. The faster you swipe, the longer it spins.</div>
      </div>
      <div class="status" aria-live="polite"><span class="status-dot"></span><span id="statusText">Ready to spin</span></div>
    </footer>
  </main>

  <script>
    (() => {
      const app = document.getElementById("app");
      const stage = document.getElementById("stage");
      const wheel = document.getElementById("wheel");
      const pointer = document.querySelector(".pointer");
      const hub = document.querySelector(".hub");
      const settingsView = document.getElementById("settingsView");
      const settingsForm = document.getElementById("settingsForm");
      const colorCountSelect = document.getElementById("colorCount");
      const settingsMessage = document.getElementById("settingsMessage");
      const backToWheel = document.getElementById("backToWheel");
      const fullscreenButton = document.getElementById("fullscreenButton");
      const instructionTitle = document.getElementById("instructionTitle");
      const instructionSubtitle = document.getElementById("instructionSubtitle");
      const statusText = document.getElementById("statusText");

      let rotation = 0;
      let angularVelocity = 0;
      let animationFrame = 0;
      let lastFrameTime = 0;
      let pointerId = null;
      let lastY = 0;
      let gestureSamples = [];

      const friction = 0.985;
      const maxVelocity = 300;
      const dragSensitivity = 0.72;
      const swipeMomentum = 1.35;
      const velocityWindowMs = 80;

      const palette = [
        { name: "RED", color: "#e74c3c" },
        { name: "ORANGE", color: "#f97316" },
        { name: "YELLOW", color: "#facc15" },
        { name: "LIME", color: "#84cc16" },
        { name: "TEAL", color: "#14b8a6" },
        { name: "BLUE", color: "#3b82f6" },
        { name: "PURPLE", color: "#8b5cf6" },
        { name: "PINK", color: "#ec4899" },
        { name: "GREEN", color: "#22c55e" },
        { name: "CYAN", color: "#06b6d4" },
        { name: "INDIGO", color: "#6366f1" },
        { name: "VIOLET", color: "#a855f7" },
        { name: "MAGENTA", color: "#d946ef" },
        { name: "ROSE", color: "#f43f5e" },
        { name: "SLATE", color: "#64748b" },
        { name: "STONE", color: "#78716c" }
      ];
      const wheelPalette = [...palette];
      for (let index = wheelPalette.length - 1; index > 0; index--) {
        const swapIndex = Math.floor(Math.random() * (index + 1));
        [wheelPalette[index], wheelPalette[swapIndex]] = [wheelPalette[swapIndex], wheelPalette[index]];
      }
      const storageKey = "orbit-color-count";
      const settingsEnabled = new URLSearchParams(window.location.search).has("opt");
      let colorCount = 8;
      let colors = [];

      function loadColorCount() {
        try {
          const savedCount = Number(window.localStorage.getItem(storageKey));
          return Number.isInteger(savedCount) && savedCount >= 2 && savedCount <= palette.length ? savedCount : 8;
        } catch (error) {
          console.error("Could not load the saved wheel color count.", error);
          settingsMessage.textContent = "Could not load saved settings. The wheel is using 8 colors.";
          return 8;
        }
      }

      function configureWheel(count) {
        colorCount = count;
        const segments = wheelPalette.slice(0, colorCount);
        colors = segments.map(({ color }) => color);
        const segmentAngle = 360 / colorCount;
        const startAngle = -segmentAngle / 2;
        wheel.style.setProperty("--segment-angle", `${segmentAngle}deg`);
        wheel.style.setProperty("--wheel-start-angle", `${startAngle}deg`);
        wheel.style.setProperty("--wheel-background", `conic-gradient(from ${startAngle}deg, ${colors.map((color, index) => `${color} ${index * segmentAngle}deg ${(index + 1) * segmentAngle}deg`).join(", ")})`);
        wheel.setAttribute("aria-label", `${colorCount}-section color wheel`);

        wheel.replaceChildren();
        segments.forEach(({ name }, index) => {
          const label = document.createElement("span");
          const angleDegrees = index * segmentAngle;
          let labelAngle = angleDegrees - 90;
          if (labelAngle > 90 || labelAngle < -90) labelAngle += 180;
          const angle = angleDegrees * Math.PI / 180;
          label.className = "wheel-label";
          label.textContent = name;
          label.style.left = `${50 + 32 * Math.sin(angle)}%`;
          label.style.top = `${50 - 32 * Math.cos(angle)}%`;
          label.style.setProperty("--label-angle", `${labelAngle}deg`);
          wheel.append(label);
        });
      }

      function render() {
        wheel.style.transform = `rotate(${rotation}deg)`;
        const segmentAngle = 360 / colorCount;
        const pointerAngle = ((segmentAngle / 2 - rotation) % 360 + 360) % 360;
        const colorIndex = Math.floor(pointerAngle / segmentAngle);
        const indicatorColor = colors[colorIndex];
        pointer.style.setProperty("--pointer-color", indicatorColor);
        hub.style.setProperty("--pointer-color", indicatorColor);
      }

      if (settingsEnabled) {
        app.classList.add("settings-mode");
        settingsView.hidden = false;
        const returnUrl = new URL(window.location.href);
        returnUrl.searchParams.delete("opt");
        backToWheel.href = returnUrl.href;
      }

      colorCount = loadColorCount();
      colorCountSelect.value = String(colorCount);
      configureWheel(colorCount);
      settingsForm.addEventListener("submit", (event) => {
        event.preventDefault();
        const selectedCount = Number(colorCountSelect.value);
        if (!Number.isInteger(selectedCount) || selectedCount < 2 || selectedCount > palette.length) {
          settingsMessage.textContent = "Choose a color count from 2 to 16.";
          return;
        }

        try {
          window.localStorage.setItem(storageKey, String(selectedCount));
        } catch (error) {
          console.error("Could not save the wheel color count.", error);
          settingsMessage.textContent = "Could not save settings. Check your browser storage permissions.";
          return;
        }

        configureWheel(selectedCount);
        render();
        settingsMessage.textContent = "Settings saved.";
      });

      function setSpinning(spinning) {
        app.classList.toggle("is-spinning", spinning);
        statusText.textContent = spinning ? "In motion" : "Ready to spin";
        instructionTitle.textContent = spinning ? "Feel the momentum" : "Swipe to set it in motion";
        instructionSubtitle.textContent = spinning
          ? "Swipe in either direction to add more spin."
          : "Swipe up or down. The faster you swipe, the longer it spins.";
      }

      function stopAnimation() {
        if (animationFrame) cancelAnimationFrame(animationFrame);
        animationFrame = 0;
      }

      function animate(now) {
        const frameScale = lastFrameTime ? Math.min((now - lastFrameTime) / 16.67, 4) : 1;
        lastFrameTime = now;
        rotation += angularVelocity * frameScale;
        angularVelocity *= Math.pow(friction, frameScale);

        if (Math.abs(angularVelocity) < 0.015) {
          angularVelocity = 0;
          animationFrame = 0;
          render();
          setSpinning(false);
          return;
        }

        render();
        animationFrame = requestAnimationFrame(animate);
      }

      function startSpin(velocity) {
        angularVelocity = Math.max(-maxVelocity, Math.min(maxVelocity, velocity));
        if (Math.abs(angularVelocity) < 0.04) return;
        stopAnimation();
        lastFrameTime = 0;
        setSpinning(true);
        animationFrame = requestAnimationFrame(animate);
      }

      render();

      stage.addEventListener("pointerdown", (event) => {
        if (event.pointerType === "mouse" && event.button !== 0) return;
        pointerId = event.pointerId;
        stage.setPointerCapture(pointerId);
        lastY = event.clientY;
        gestureSamples = [{ y: lastY, time: performance.now() }];
        stopAnimation();
        angularVelocity = 0;
        setSpinning(false);
      });

      stage.addEventListener("pointermove", (event) => {
        if (event.pointerId !== pointerId) return;
        const now = performance.now();
        const deltaY = event.clientY - lastY;
        rotation += deltaY * dragSensitivity;
        lastY = event.clientY;
        gestureSamples.push({ y: lastY, time: now });
        while (gestureSamples.length > 2 && gestureSamples[1].time < now - velocityWindowMs) {
          gestureSamples.shift();
        }
        render();
      });

      function endGesture(event) {
        if (event.pointerId !== pointerId) return;
        pointerId = null;
        const firstSample = gestureSamples[0];
        const lastSample = gestureSamples[gestureSamples.length - 1];
        const elapsed = Math.max(1, lastSample.time - firstSample.time);
        const velocity = ((lastSample.y - firstSample.y) * dragSensitivity / elapsed) * 16.67 * swipeMomentum;
        startSpin(velocity);
      }

      stage.addEventListener("pointerup", endGesture);
      stage.addEventListener("pointercancel", endGesture);
      stage.addEventListener("lostpointercapture", (event) => {
        if (event.pointerId === pointerId) pointerId = null;
      });

      document.addEventListener("keydown", (event) => {
        if (event.key !== "ArrowUp" && event.key !== "ArrowDown" && event.code !== "Space") return;
        if (event.target instanceof HTMLElement && event.target.closest("button")) return;
        event.preventDefault();
        const direction = event.key === "ArrowUp" ? -1 : 1;
        startSpin(direction * (event.code === "Space" ? 1.25 : 0.85));
      });

      fullscreenButton.addEventListener("click", async () => {
        try {
          if (!document.fullscreenElement) {
            await document.documentElement.requestFullscreen();
          } else {
            await document.exitFullscreen();
          }
        } catch (error) {
          statusText.textContent = "Fullscreen unavailable";
          window.setTimeout(() => {
            if (!app.classList.contains("is-spinning")) statusText.textContent = "Ready to spin";
          }, 1800);
        }
      });

      document.addEventListener("fullscreenchange", () => {
        const isFullscreen = Boolean(document.fullscreenElement);
        fullscreenButton.setAttribute("aria-label", isFullscreen ? "Exit fullscreen" : "Enter fullscreen");
        fullscreenButton.querySelector(".fullscreen-label").textContent = isFullscreen ? "Exit fullscreen" : "Go fullscreen";
      });

      render();
    })();
  </script>
</body>
</html>
